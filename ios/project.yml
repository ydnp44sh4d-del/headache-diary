name: MallockExpenseTracker
options:
  bundleIdPrefix: uk.mallock
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  MallockExpenseTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MallockExpenseTracker
    dependencies:
      - package: ZIPFoundation
    info:
      path: MallockExpenseTracker/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Mallock Expense Tracker uses the camera to scan receipts so expenses can be logged automatically."
        NSPhotoLibraryUsageDescription: "Mallock Expense Tracker needs access to your photo library to attach receipt images to expenses."
        UIAppFonts:
          - SpaceGrotesk-Bold.ttf
          - SpaceGrotesk-SemiBold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.mallock.expensetracker
        PRODUCT_NAME: "Mallock Expenses"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
      gatherCoverageData: false
